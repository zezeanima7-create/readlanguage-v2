<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#101b16">
<title>ReadLanguage · Administração</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#101713;--panel:#1a251e;--green:#55e28a;--text:#f4fff6;--muted:#a6b9aa;--border:#304438;--red:#ff7777}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}
header{padding:18px;border-bottom:1px solid var(--border);display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-weight:800;font-size:19px}.brand span{color:var(--green)}
main{width:min(100% - 28px,760px);margin:28px auto}.panel,.log{background:var(--panel);border:1px solid var(--border);border-radius:16px;padding:20px;margin-bottom:14px}
h1{margin-top:0;font-size:26px}p{line-height:1.5}.muted{color:var(--muted);font-size:14px}
button{border:0;border-radius:11px;padding:12px 16px;font-weight:bold;cursor:pointer}
.primary{background:var(--green);color:#102016}.secondary{background:#29382e;color:white;border:1px solid var(--border)}
.row{display:flex;gap:10px;flex-wrap:wrap}.row button{flex:1}
.message{color:var(--green);min-height:22px}.error{color:var(--red)}
.log strong{color:var(--green)}.log p{margin:8px 0 0;overflow-wrap:anywhere}
</style>
</head>
<body>
<header><div class="brand">ReadLanguage <span>Plus</span></div><button class="secondary" id="back">← Voltar ao app</button></header>
<main>
<section class="panel">
<h1>🔒 Central de Logs</h1>
<p class="muted">Área administrativa privada. Registros recentes de atividade das contas.</p>
<div class="row"><button class="primary" id="refresh">Atualizar registros</button><button class="secondary" id="logout">Sair da conta</button></div>
<p id="status" class="message">Verificando acesso...</p>
<div id="logs"></div>
</section>
</main>
<script>
const SUPABASE_URL="https://nbuntcjbaewuhrdnimnq.supabase.co";
const SUPABASE_PUBLISHABLE_KEY="sb_publishable_XYETefH_CGyZUHQOp92c9w_Ya_WNdvA";
const client=window.supabase.createClient(SUPABASE_URL,SUPABASE_PUBLISHABLE_KEY);
const $=id=>document.getElementById(id);
$("back").onclick=()=>location.href="./index.html";
async function guard(){
 const {data,error}=await client.auth.getSession();
 if(error||!data.session){$("status").textContent="Faça login no ReadLanguage para continuar."; $("status").classList.add("error"); return false;}
 if(data.session.user.app_metadata?.role!=="admin"){ $("status").textContent="Acesso negado: esta conta não é administradora."; $("status").classList.add("error"); return false; }
 return true;
}
async function loadLogs(){
 $("logs").replaceChildren(); $("status").classList.remove("error");
 if(!await guard())return;
 $("status").textContent="Carregando registros...";
 const {data,error}=await client.from("admin_audit_logs").select("id,event_type,account_email,details,created_at").order("created_at",{ascending:false}).limit(100);
 if(error){$("status").textContent="Erro ao carregar logs. Verifique as políticas RLS."; $("status").classList.add("error");return;}
 $("status").textContent=data.length?data.length+" registro(s) recente(s).":"Nenhum registro encontrado.";
 data.forEach(item=>{
  const card=document.createElement("article");card.className="log";
  const title=document.createElement("strong");title.textContent=item.event_type;
  const meta=document.createElement("p");meta.className="muted";meta.textContent=(item.account_email||"Conta não identificada")+" · "+new Date(item.created_at).toLocaleString("pt-BR");
  const details=document.createElement("p");details.textContent=item.details||"Sem detalhes adicionais.";
  card.append(title,meta,details);$("logs").append(card);
 });
}
$("refresh").onclick=loadLogs;
$("logout").onclick=async()=>{await client.auth.signOut();location.href="./index.html";};
client.auth.onAuthStateChange(()=>loadLogs());
loadLogs();
</script>
</body>
</html>
