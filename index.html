
<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#101b2d">
  <meta name="description" content="ReadLanguage — aprenda idiomas de forma interativa.">
  <title>ReadLanguage</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background: #101b2d;
      color: #f4f7ff;
      font-family: Arial, sans-serif;
    }

    header {
      padding: 20px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid #29374c;
    }

    .logo {
      font-size: 23px;
      font-weight: 800;
      color: #58e6a5;
    }

    .xp {
      background: #26364b;
      padding: 10px 14px;
      border-radius: 14px;
      font-weight: bold;
    }

    main {
      max-width: 800px;
      padding: 24px 16px;
      margin: auto;
    }

    .hero {
      padding: 30px 22px;
      border-radius: 24px;
      background: linear-gradient(135deg, #1c3d48, #25345b);
      margin-bottom: 25px;
    }

    .hero h1 {
      font-size: clamp(28px, 7vw, 42px);
      margin: 0 0 12px;
    }

    .hero p {
      color: #c8d6e8;
      line-height: 1.6;
    }

    .section-title {
      margin: 28px 0 15px;
    }

    .languages {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(140px, 1fr));
      gap: 12px;
    }

    button, .button {
      font: inherit;
      cursor: pointer;
      border: 1px solid #35465e;
      border-radius: 16px;
      padding: 16px;
      background: #1b293d;
      color: white;
      text-align: left;
    }

    button:hover {
      border-color: #58e6a5;
    }

    .language {
      display: flex;
      align-items: center;
      gap: 12px;
      min-height: 75px;
      font-weight: bold;
    }

    .flag {
      font-size: 28px;
    }

    .primary {
      background: #58e6a5;
      color: #10251f;
      border: none;
      font-weight: bold;
      text-align: center;
    }

    .lesson {
      margin-top: 22px;
      padding: 22px;
      background: #1b293d;
      border: 1px solid #35465e;
      border-radius: 20px;
    }

    .lesson h2 {
      margin-top: 0;
    }

    .question {
      font-size: 24px;
      font-weight: bold;
      margin: 24px 0;
    }

    .answers {
      display: grid;
      gap: 10px;
    }

    .answer {
      width: 100%;
    }

    .answer.correct {
      background: #174b3c;
      border-color: #58e6a5;
    }

    .answer.wrong {
      background: #512d39;
      border-color: #ff8495;
    }

    .feedback {
      min-height: 26px;
      margin: 16px 0;
      font-weight: bold;
    }

    .progress {
      height: 8px;
      background: #35465e;
      border-radius: 99px;
      overflow: hidden;
      margin: 16px 0;
    }

    .progress-bar {
      width: 0;
      height: 100%;
      background: #58e6a5;
      transition: width .3s;
    }

    .hidden {
      display: none;
    }

    footer {
      text-align: center;
      color: #9bacc3;
      padding: 30px 16px;
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after {
        scroll-behavior: auto !important;
        transition: none !important;
      }
    }
  </style>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header>
    <div class="logo">ReadLanguage</div>
    <div class="xp">⭐ <span id="xp">0</span> XP</div>
  </header>

  <main>
    <section class="hero">
      <h1>Aprenda um idioma por dia.</h1>
      <p>
        Pratique palavras, responda às perguntas e avance
        no seu próprio ritmo.
      </p>
      <button class="primary" id="startButton">
        Começar a aprender →
      </button>
    </section>

    <h2 class="section-title">Escolha seu idioma</h2>

    <section class="languages" id="languages">
      <button class="language" data-language="en">
        <span class="flag">🇺🇸</span> Inglês
      </button>
      <button class="language" data-language="es">
        <span class="flag">🇪🇸</span> Espanhol
      </button>
      <button class="language" data-language="fr">
        <span class="flag">🇫🇷</span> Francês
      </button>
      <button class="language" data-language="de">
        <span class="flag">🇩🇪</span> Alemão
      </button>
      <button class="language" data-language="it">
        <span class="flag">🇮🇹</span> Italiano
      </button>
      <button class="language" data-language="ja">
        <span class="flag">🇯🇵</span> Japonês
      </button>
    </section>

    <section class="lesson hidden" id="lesson">
      <div id="lessonLanguage">Curso de inglês</div>
      <div class="progress">
        <div class="progress-bar" id="progressBar"></div>
      </div>

      <h2>Traduza a palavra</h2>
      <div class="question" id="question">Hello</div>
      <div class="answers" id="answers"></div>
      <div class="feedback" id="feedback" aria-live="polite"></div>

      <button class="primary hidden" id="nextButton">
        Próxima pergunta →
      </button>
      <button id="exitButton">Voltar aos idiomas</button>
    </section>

    <section class="lesson">
      <h2>Seu progresso</h2>
      <p>Acertos: <strong id="correctCount">0</strong></p>
      <p>Palavras aprendidas nesta sessão: <strong id="learnedCount">0</strong></p>
      <button id="resetButton">Reiniciar progresso</button>
    </section>
  </main>

  <footer>
    ReadLanguage · Aprenda no seu ritmo
  </footer>

  <script src="animation.js"></script>

  <script>
    const courses = {
      en: {
        name: "Inglês",
        questions: [
          { word: "Hello", correct: "Olá", options: ["Olá", "Adeus", "Obrigado", "Por favor"] },
          { word: "Water", correct: "Água", options: ["Leite", "Água", "Pão", "Casa"] },
          { word: "Thank you", correct: "Obrigado(a)", options: ["Desculpe", "Bom dia", "Obrigado(a)", "Boa noite"] },
          { word: "Book", correct: "Livro", options: ["Caneta", "Mesa", "Livro", "Janela"] },
          { word: "Good morning", correct: "Bom dia", options: ["Boa noite", "Bom dia", "Até logo", "Por favor"] }
        ]
      },
      es: {
        name: "Espanhol",
        questions: [
          { word: "Hola", correct: "Olá", options: ["Adeus", "Olá", "Obrigado", "Água"] },
          { word: "Agua", correct: "Água", options: ["Casa", "Livro", "Água", "Pão"] },
          { word: "Gracias", correct: "Obrigado(a)", options: ["Obrigado(a)", "Desculpe", "Olá", "Sim"] },
          { word: "Libro", correct: "Livro", options: ["Livro", "Mesa", "Janela", "Cadeira"] },
          { word: "Buenos días", correct: "Bom dia", options: ["Boa noite", "Até logo", "Bom dia", "Por favor"] }
        ]
      },
      fr: {
        name: "Francês",
        questions: [
          { word: "Bonjour", correct: "Bom dia", options: ["Obrigado", "Adeus", "Bom dia", "Água"] },
          { word: "Eau", correct: "Água", options: ["Água", "Pão", "Casa", "Livro"] },
          { word: "Merci", correct: "Obrigado(a)", options: ["Olá", "Obrigado(a)", "Desculpe", "Sim"] },
          { word: "Livre", correct: "Livro", options: ["Mesa", "Livro", "Janela", "Cadeira"] },
          { word: "Au revoir", correct: "Adeus", options: ["Bom dia", "Obrigado", "Adeus", "Por favor"] }
        ]
      },
      de: {
        name: "Alemão",
        questions: [
          { word: "Hallo", correct: "Olá", options: ["Adeus", "Olá", "Água", "Livro"] },
          { word: "Wasser", correct: "Água", options: ["Água", "Pão", "Casa", "Mesa"] },
          { word: "Danke", correct: "Obrigado(a)", options: ["Bom dia", "Obrigado(a)", "Até logo", "Desculpe"] },
          { word: "Buch", correct: "Livro", options: ["Caneta", "Cadeira", "Livro", "Janela"] },
          { word: "Tschüss", correct: "Tchau", options: ["Bom dia", "Tchau", "Obrigado", "Água"] }
        ]
      },
      it: {
        name: "Italiano",
        questions: [
          { word: "Ciao", correct: "Olá", options: ["Obrigado", "Olá", "Água", "Livro"] },
          { word: "Acqua", correct: "Água", options: ["Casa", "Água", "Pão", "Mesa"] },
          { word: "Grazie", correct: "Obrigado(a)", options: ["Adeus", "Olá", "Obrigado(a)", "Desculpe"] },
          { word: "Libro", correct: "Livro", options: ["Livro", "Janela", "Cadeira", "Caneta"] },
          { word: "Arrivederci", correct: "Até logo", options: ["Bom dia", "Obrigado", "Até logo", "Água"] }
        ]
      },
      ja: {
        name: "Japonês",
        questions: [
          { word: "こんにちは", correct: "Olá", options: ["Adeus", "Olá", "Obrigado", "Água"] },
          { word: "水 (みず)", correct: "Água", options: ["Livro", "Casa", "Água", "Pão"] },
          { word: "ありがとう", correct: "Obrigado(a)", options: ["Obrigado(a)", "Bom dia", "Adeus", "Por favor"] },
          { word: "本 (ほん)", correct: "Livro", options: ["Mesa", "Livro", "Janela", "Cadeira"] },
          { word: "さようなら", correct: "Adeus", options: ["Olá", "Água", "Adeus", "Obrigado"] }
        ]
      }
    };

    const $ = id => document.getElementById(id);

    let language = "en";
    let questionIndex = 0;
    let correct = 0;
    let answered = false;
    let xp = Number(localStorage.getItem("rl-xp") || 0);
    let learned = Number(localStorage.getItem("rl-learned") || 0);
    let totalCorrect = Number(localStorage.getItem("rl-correct") || 0);

    function updateStats() {
      $("xp").textContent = xp;
      $("correctCount").textContent = totalCorrect;
      $("learnedCount").textContent = learned;
    }

    function saveStats() {
      localStorage.setItem("rl-xp", xp);
      localStorage.setItem("rl-learned", learned);
      localStorage.setItem("rl-correct", totalCorrect);
      updateStats();
    }

    function startCourse(code = language) {
      language = code;
      questionIndex = 0;
      correct = 0;
      $("lesson").classList.remove("hidden");
      $("lessonLanguage").textContent = "Curso de " + courses[language].name;
      $("lesson").scrollIntoView({ behavior: "smooth", block: "start" });
      renderQuestion();
    }

    function renderQuestion() {
      answered = false;
      const list = courses[language].questions;
      const q = list[questionIndex];

      $("question").textContent = q.word;
      $("feedback").textContent = "";
      $("nextButton").classList.add("hidden");
      $("progressBar").style.width = (questionIndex / list.length * 100) + "%";
      $("answers").replaceChildren();

      [...q.options].sort(() => Math.random() - 0.5).forEach(option => {
        const button = document.createElement("button");
        button.className = "answer";
        button.textContent = option;
        button.addEventListener("click", () => chooseAnswer(button, option, q.correct));
        $("answers").appendChild(button);
      });
    }

    function chooseAnswer(button, option, answer) {
      if (answered) return;
      answered = true;

      document.querySelectorAll(".answer").forEach(el => {
        el.disabled = true;
        if (el.textContent === answer) el.classList.add("correct");
      });

      if (option === answer) {
        correct++;
        xp += 10;
        learned++;
        totalCorrect++;
        $("feedback").textContent = "Muito bem! +10 XP";
      } else {
        button.classList.add("wrong");
        $("feedback").textContent = "Quase! Resposta: " + answer;
      }

      saveStats();
      $("progressBar").style.width =
        ((questionIndex + 1) / courses[language].questions.length * 100) + "%";
      $("nextButton").classList.remove("hidden");
      $("nextButton").textContent =
        questionIndex === courses[language].questions.length - 1
          ? "Concluir lição ✓"
          : "Próxima pergunta →";
    }

    $("startButton").addEventListener("click", () => startCourse());

    $("languages").addEventListener("click", event => {
      const button = event.target.closest("[data-language]");
      if (button) startCourse(button.dataset.language);
    });

    $("nextButton").addEventListener("click", () => {
      if (questionIndex < courses[language].questions.length - 1) {
        questionIndex++;
        renderQuestion();
      } else {
        $("question").textContent = "Lição concluída!";
        $("answers").replaceChildren();
        $("feedback").textContent =
          `Você acertou ${correct} de ${courses[language].questions.length} perguntas.`;
        $("progressBar").style.width = "100%";
        $("nextButton").classList.add("hidden");
      }
    });

    $("exitButton").addEventListener("click", () => {
      $("lesson").classList.add("hidden");
      $("languages").scrollIntoView({ behavior: "smooth" });
    });

    $("resetButton").addEventListener("click", () => {
      if (!confirm("Apagar o XP e as estatísticas salvas neste aparelho?")) return;
      xp = 0;
      learned = 0;
      totalCorrect = 0;
      saveStats();
    });

    updateStats();
  </script>
</body>
        </html>
